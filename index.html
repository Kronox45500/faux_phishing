<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test JavaScript Mobile</title>

<style>

body{
    font-family:Arial,sans-serif;
    padding:20px;
    background:#111;
    color:white;
}

#status{
    padding:20px;
    border-radius:12px;
    font-weight:bold;
    margin-bottom:20px;
    background:#b00020;
}

#status.loaded{
    background:#ff9800;
}

#status.success{
    background:#2e7d32;
}

#status.error{
    background:#c62828;
}

button{
    width:100%;
    min-height:60px;
    font-size:18px;
}

</style>

<!-- Si JS ne se charge pas du tout -->
<noscript>
<style>
#status{
    background:#c62828 !important;
}
</style>
</noscript>

</head>
<body>

<div id="status">
    ❌ JavaScript non chargé
</div>

<h1>Test JavaScript</h1>

<p>
    Si tout fonctionne, le message rouge doit devenir vert
    après quelques secondes.
</p>

<button id="testBtn">
    Bouton de test
</button>

<script>

try {

    const status = document.getElementById("status");

    status.classList.add("loaded");
    status.innerHTML =
        "🟠 JavaScript chargé";

    console.log("JS chargé");

    setTimeout(() => {

        status.classList.remove("loaded");
        status.classList.add("success");

        status.innerHTML =
            "✅ JavaScript exécuté correctement";

    }, 2000);

    document
        .getElementById("testBtn")
        .addEventListener("click", () => {

            alert("Le JavaScript fonctionne sur ce téléphone.");

            if(navigator.vibrate){
                navigator.vibrate(200);
            }

        });

}
catch(error){

    const status =
        document.getElementById("status");

    status.classList.remove("loaded");

    status.classList.add("error");

    status.innerHTML =
        "❌ Erreur JavaScript : " + error.message;

    console.error(error);
}

window.onerror = function(message){

    const status =
        document.getElementById("status");

    status.classList.remove("loaded");

    status.classList.add("error");

    status.innerHTML =
        "❌ Plantage JS : " + message;

};

</script>

</body>
</html>
